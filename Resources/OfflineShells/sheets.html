<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-color: #0F9D58;
            --bg-color: #ffffff;
            --card-bg: #f8fafd;
            --text-primary: #202124;
            --text-secondary: #5f6368;
            --border-color: #dadce0;
            --hover-bg: #f1f3f4;
            --search-bg: #edf2fc;
            --cell-border: #e0e0e0;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1f1f1f;
                --card-bg: #28292a;
                --text-primary: #e8eaed;
                --text-secondary: #9aa0a6;
                --border-color: #3c4043;
                --hover-bg: #2d2e30;
                --search-bg: #2b2d30;
                --cell-border: #333333;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: "Google Sans", "Roboto", -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header */
        header.gb_Wd {
            height: 64px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 16px;
            flex-shrink: 0;
            background-color: var(--bg-color);
        }
        .gb_nav_btn {
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-secondary);
        }
        .gb_nav_btn:hover { background-color: var(--hover-bg); }
        .gb_logo_area { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .gb_title { font-size: 22px; font-weight: 500; color: var(--text-primary); }

        .gb_search_wrap { flex: 1; max-width: 720px; margin: 0 auto; position: relative; }
        .gb_search_input {
            width: 100%; height: 46px; background-color: var(--search-bg);
            border: 1px solid transparent; border-radius: 24px; padding: 0 16px 0 48px;
            font-size: 15px; font-family: inherit; color: var(--text-primary); outline: none;
        }
        .gb_search_input:focus { background-color: var(--bg-color); border-color: var(--border-color); }
        .gb_search_icon { position: absolute; left: 16px; top: 13px; color: var(--text-secondary); }

        .gb_right { display: flex; align-items: center; gap: 12px; }
        .gb_offline_badge {
            display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500;
            color: #137333; background-color: #e6f4ea; padding: 5px 12px; border-radius: 14px;
        }
        .gb_avatar {
            width: 34px; height: 34px; border-radius: 50%; background-color: #0F9D58;
            color: white; display: flex; align-items: center; justify-content: center; font-weight: 500;
        }

        /* Start a new spreadsheet */
        .sheets_strip {
            background-color: var(--card-bg); padding: 24px 32px 32px; border-bottom: 1px solid var(--border-color);
        }
        .sheets_strip_inner { max-width: 980px; margin: 0 auto; }
        .sheets_strip_header { font-size: 15px; font-weight: 500; color: var(--text-secondary); margin-bottom: 16px; }
        .sheets_card {
            width: 130px; height: 165px; background-color: var(--bg-color); border: 1px solid var(--border-color);
            border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;
        }
        .sheets_card:hover { border-color: #0F9D58; box-shadow: 0 2px 8px rgba(0,0,0,0.12); transform: translateY(-2px); }

        /* Recent Spreadsheets */
        .sheets_container { flex: 1; max-width: 980px; width: 100%; margin: 0 auto; padding: 24px 32px; overflow-y: auto; }
        .sheets_header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 15px; font-weight: 500; }
        .sheets_col_headers {
            display: grid; grid-template-columns: 1fr 180px 180px 48px; padding: 10px 16px;
            font-size: 13px; font-weight: 500; color: var(--text-secondary); border-bottom: 1px solid var(--border-color);
        }
        .sheet_row {
            display: grid; grid-template-columns: 1fr 180px 180px 48px; align-items: center;
            padding: 12px 16px; border-bottom: 1px solid var(--border-color); cursor: pointer; border-radius: 4px;
        }
        .sheet_row:hover { background-color: var(--hover-bg); }
        .sheet_title_cell { display: flex; align-items: center; gap: 14px; font-weight: 500; }

        /* Fullscreen Google Sheets Grid Editor */
        #sheetsEditorOverlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-color); z-index: 2000; flex-direction: column;
        }
        .editor_topbar {
            height: 60px; display: flex; align-items: center; padding: 0 16px; gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .editor_title_input {
            font-family: inherit; font-size: 18px; font-weight: 500; color: var(--text-primary);
            background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 2px 6px; outline: none;
        }
        .formula_bar {
            height: 38px; display: flex; align-items: center; padding: 0 16px; gap: 12px;
            background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); font-size: 13px;
        }
        .fx_label { font-weight: bold; color: var(--text-secondary); }
        .formula_input { flex: 1; height: 26px; border: 1px solid var(--border-color); border-radius: 2px; padding: 0 8px; font-family: monospace; outline: none; }
        
        .grid_container { flex: 1; overflow: auto; background-color: var(--bg-color); }
        table.sheet_table { border-collapse: collapse; width: 100%; }
        table.sheet_table th {
            background-color: var(--hover-bg); border: 1px solid var(--cell-border); font-size: 11px; font-weight: bold;
            color: var(--text-secondary); height: 24px; min-width: 80px; text-align: center;
        }
        table.sheet_table td {
            border: 1px solid var(--cell-border); height: 24px; min-width: 80px; padding: 2px 6px; font-size: 13px;
            outline: none; user-select: text;
        }
        table.sheet_table td:focus {
            outline: 2px solid #0F9D58; z-index: 5;
        }
    </style>
</head>
<body>
    <header class="gb_Wd">
        <div class="gb_nav_btn" onclick="location.reload()" title="Main menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor"/></svg>
        </div>
        <div class="gb_logo_area" onclick="location.reload()">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z" fill="#0F9D58"/><path d="M7 7h10v2H7zm0 4h10v2H7zm0 4h7v2H7z" fill="#0F9D58"/></svg>
            <span class="gb_title">Sheets</span>
        </div>
        
        <div class="gb_search_wrap">
            <svg class="gb_search_icon" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/></svg>
            <input type="text" class="gb_search_input" id="searchBox" placeholder="Search" oninput="filterSheets(this.value)">
        </div>

        <div class="gb_right">
            <div class="gb_offline_badge">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM10 17l-3.5-3.5 1.41-1.41L10 14.17l5.59-5.59L17 10l-7 7z" fill="currentColor"/></svg>
                <span>Offline</span>
            </div>
            <div class="gb_avatar">C</div>
        </div>
    </header>

    <div class="sheets_strip">
        <div class="sheets_strip_inner">
            <div class="sheets_strip_header">Start a new spreadsheet</div>
            <div class="sheets_card" onclick="createNewSheet()">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="#0F9D58"/></svg>
            </div>
        </div>
    </div>

    <div class="sheets_container">
        <div class="sheets_header">
            <span>Recent spreadsheets</span>
        </div>
        <div class="sheets_col_headers">
            <span>Title</span>
            <span>Owned by</span>
            <span>Last opened by me</span>
            <span></span>
        </div>
        <div id="sheetsListTable"></div>
    </div>

    <!-- Fullscreen Google Sheets Grid Editor -->
    <div id="sheetsEditorOverlay">
        <div class="editor_topbar">
            <div class="gb_nav_btn" onclick="closeEditor()" title="Return to Sheets home">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/></svg>
            </div>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z" fill="#0F9D58"/><path d="M7 7h10v2H7zm0 4h10v2H7zm0 4h7v2H7z" fill="#0F9D58"/></svg>
            <input type="text" class="editor_title_input" id="sheetTitleInput" value="Untitled spreadsheet" oninput="saveCurrentSheet()">
            <div style="flex: 1;"></div>
            <div class="gb_offline_badge">Saved offline</div>
        </div>
        <div class="formula_bar">
            <span class="fx_label">fx</span>
            <input type="text" class="formula_input" id="formulaInput" placeholder="Enter text or formula...">
        </div>
        <div class="grid_container" id="gridTableContainer"></div>
    </div>

    <script>
        let activeSheetId = null;
        const DEFAULT_SHEETS = [
            { id: "sheet_1", title: "Quarterly Budget 2026", owner: "me", date: "12 Nov 2026" },
            { id: "sheet_2", title: "Project Milestones & Deliverables", owner: "me", date: "11 Nov 2026" },
            { id: "sheet_3", title: "Student Roster & Attendance", owner: "me", date: "10 Nov 2026" }
        ];

        function loadSheets() {
            let sheets = JSON.parse(localStorage.getItem("workspace_offline_sheets") || "null");
            if (!sheets) {
                sheets = DEFAULT_SHEETS;
                localStorage.setItem("workspace_offline_sheets", JSON.stringify(sheets));
            }
            renderSheets(sheets);
        }

        function renderSheets(sheets) {
            const table = document.getElementById("sheetsListTable");
            let html = "";
            sheets.forEach(s => {
                html += `
                <div class="sheet_row" onclick="openSheet('${s.id}')">
                    <div class="sheet_title_cell">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z" fill="#0F9D58"/><path d="M7 7h10v2H7zm0 4h10v2H7zm0 4h7v2H7z" fill="#0F9D58"/></svg>
                        <span>${s.title}</span>
                    </div>
                    <div style="color: var(--text-secondary); font-size: 13px;">${s.owner}</div>
                    <div style="color: var(--text-secondary); font-size: 13px;">${s.date}</div>
                    <div style="text-align: right; color: var(--text-secondary);">⋮</div>
                </div>
                `;
            });
            table.innerHTML = html;
        }

        function filterSheets(q) {
            const query = q.toLowerCase();
            const sheets = JSON.parse(localStorage.getItem("workspace_offline_sheets") || "[]");
            renderSheets(sheets.filter(s => s.title.toLowerCase().includes(query)));
        }

        function createNewSheet() {
            const newId = "sheet_" + Date.now();
            const newSheet = { id: newId, title: "Untitled spreadsheet", owner: "me", date: "Today" };
            const sheets = JSON.parse(localStorage.getItem("workspace_offline_sheets") || "[]");
            sheets.unshift(newSheet);
            localStorage.setItem("workspace_offline_sheets", JSON.stringify(sheets));
            openSheet(newId);
        }

        function openSheet(id) {
            activeSheetId = id;
            const sheets = JSON.parse(localStorage.getItem("workspace_offline_sheets") || "[]");
            const sheet = sheets.find(s => s.id === id);
            if (!sheet) return;
            document.getElementById("sheetTitleInput").value = sheet.title;
            buildGrid();
            document.getElementById("sheetsEditorOverlay").style.display = "flex";
        }

        function buildGrid() {
            const cols = ["", "A", "B", "C", "D", "E", "F", "G", "H", "I", "J"];
            let html = '<table class="sheet_table"><thead><tr>';
            cols.forEach(c => html += `<th>${c}</th>`);
            html += '</tr></thead><tbody>';
            for (let r = 1; r <= 30; r++) {
                html += `<tr><th>${r}</th>`;
                for (let c = 1; c < cols.length; c++) {
                    const cellKey = `c_${activeSheetId}_${r}_${c}`;
                    const val = localStorage.getItem(cellKey) || "";
                    html += `<td contenteditable="true" onblur="saveCell('${cellKey}', this.innerText)" onfocus="selectCell(this)">${val}</td>`;
                }
                html += '</tr>';
            }
            html += '</tbody></table>';
            document.getElementById("gridTableContainer").innerHTML = html;
        }

        function selectCell(cell) {
            document.getElementById("formulaInput").value = cell.innerText;
        }

        function saveCell(key, val) {
            localStorage.setItem(key, val);
        }

        function closeEditor() {
            document.getElementById("sheetsEditorOverlay").style.display = "none";
            loadSheets();
        }

        function saveCurrentSheet() {
            if (!activeSheetId) return;
            const title = document.getElementById("sheetTitleInput").value;
            const sheets = JSON.parse(localStorage.getItem("workspace_offline_sheets") || "[]");
            const idx = sheets.findIndex(s => s.id === activeSheetId);
            if (idx >= 0) {
                sheets[idx].title = title;
                localStorage.setItem("workspace_offline_sheets", JSON.stringify(sheets));
            }
        }

        window.onload = loadSheets;
    </script>
</body>
</html>
