<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Slides</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-color: #F4B400;
            --bg-color: #ffffff;
            --card-bg: #f8fafd;
            --text-primary: #202124;
            --text-secondary: #5f6368;
            --border-color: #dadce0;
            --hover-bg: #f1f3f4;
            --search-bg: #edf2fc;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1f1f1f;
                --card-bg: #28292a;
                --text-primary: #e8eaed;
                --text-secondary: #9aa0a6;
                --border-color: #3c4043;
                --hover-bg: #2d2e30;
                --search-bg: #2b2d30;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: "Google Sans", "Roboto", -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color); color: var(--text-primary);
            height: 100vh; display: flex; flex-direction: column; overflow-x: hidden;
        }
        header.gb_Wd {
            height: 64px; border-bottom: 1px solid var(--border-color); display: flex;
            align-items: center; padding: 0 16px; gap: 16px; flex-shrink: 0;
        }
        .gb_nav_btn {
            width: 44px; height: 44px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; cursor: pointer; color: var(--text-secondary);
        }
        .gb_nav_btn:hover { background-color: var(--hover-bg); }
        .gb_logo_area { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .gb_title { font-size: 22px; font-weight: 500; color: var(--text-primary); }
        .gb_search_wrap { flex: 1; max-width: 720px; margin: 0 auto; position: relative; }
        .gb_search_input {
            width: 100%; height: 46px; background-color: var(--search-bg);
            border: 1px solid transparent; border-radius: 24px; padding: 0 16px 0 48px;
            font-size: 15px; font-family: inherit; color: var(--text-primary); outline: none;
        }
        .gb_search_icon { position: absolute; left: 16px; top: 13px; color: var(--text-secondary); }
        .gb_right { display: flex; align-items: center; gap: 12px; }
        .gb_offline_badge {
            display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500;
            color: #b06000; background-color: #fef7e0; padding: 5px 12px; border-radius: 14px;
        }
        .gb_avatar {
            width: 34px; height: 34px; border-radius: 50%; background-color: #F4B400;
            color: white; display: flex; align-items: center; justify-content: center; font-weight: 500;
        }

        .slides_strip { background-color: var(--card-bg); padding: 24px 32px 32px; border-bottom: 1px solid var(--border-color); }
        .slides_strip_inner { max-width: 980px; margin: 0 auto; }
        .slides_card {
            width: 130px; height: 165px; background-color: var(--bg-color); border: 1px solid var(--border-color);
            border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;
        }
        .slides_card:hover { border-color: #F4B400; box-shadow: 0 2px 8px rgba(0,0,0,0.12); transform: translateY(-2px); }

        .slides_container { flex: 1; max-width: 980px; width: 100%; margin: 0 auto; padding: 24px 32px; overflow-y: auto; }
        .slides_header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 15px; font-weight: 500; }
        .slides_row {
            display: grid; grid-template-columns: 1fr 180px 180px 48px; align-items: center;
            padding: 12px 16px; border-bottom: 1px solid var(--border-color); cursor: pointer; border-radius: 4px;
        }
        .slides_row:hover { background-color: var(--hover-bg); }
        .slide_title_cell { display: flex; align-items: center; gap: 14px; font-weight: 500; }

        /* Fullscreen Slides Editor */
        #slidesEditorOverlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-color); z-index: 2000; flex-direction: column;
        }
        .editor_topbar {
            height: 60px; display: flex; align-items: center; padding: 0 16px; gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .editor_title_input {
            font-family: inherit; font-size: 18px; font-weight: 500; color: var(--text-primary);
            background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 2px 6px; outline: none;
        }
        .slide_workspace { flex: 1; display: flex; background-color: var(--card-bg); overflow: hidden; }
        .slide_thumbs { width: 180px; border-right: 1px solid var(--border-color); padding: 16px; overflow-y: auto; }
        .slide_thumb_item {
            width: 100%; height: 80px; background-color: var(--bg-color); border: 2px solid #F4B400;
            border-radius: 4px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; font-size: 11px;
        }
        .slide_canvas_area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; }
        .slide_canvas {
            width: 800px; height: 450px; background-color: var(--bg-color); border: 1px solid var(--border-color);
            box-shadow: 0 2px 12px rgba(0,0,0,0.15); border-radius: 4px; padding: 48px; outline: none; user-select: text;
        }
    </style>
</head>
<body>
    <header class="gb_Wd">
        <div class="gb_nav_btn" onclick="location.reload()" title="Main menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor"/></svg>
        </div>
        <div class="gb_logo_area" onclick="location.reload()">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z" fill="#F4B400"/><path d="M8 8h8v8H8z" fill="#F4B400"/></svg>
            <span class="gb_title">Slides</span>
        </div>
        <div class="gb_search_wrap">
            <svg class="gb_search_icon" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/></svg>
            <input type="text" class="gb_search_input" id="searchBox" placeholder="Search" oninput="filterSlides(this.value)">
        </div>
        <div class="gb_right">
            <div class="gb_offline_badge">Offline</div>
            <div class="gb_avatar">C</div>
        </div>
    </header>

    <div class="slides_strip">
        <div class="slides_strip_inner">
            <div style="font-size: 15px; font-weight: 500; color: var(--text-secondary); margin-bottom: 16px;">Start a new presentation</div>
            <div class="slides_card" onclick="createNewSlide()">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="#F4B400"/></svg>
            </div>
        </div>
    </div>

    <div class="slides_container">
        <div class="slides_header"><span>Recent presentations</span></div>
        <div id="slidesListTable"></div>
    </div>

    <div id="slidesEditorOverlay">
        <div class="editor_topbar">
            <div class="gb_nav_btn" onclick="closeEditor()" title="Return to Slides home">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/></svg>
            </div>
            <input type="text" class="editor_title_input" id="slideTitleInput" value="Untitled presentation" oninput="saveCurrentSlide()">
            <div style="flex: 1;"></div>
            <div class="gb_offline_badge">Saved offline</div>
        </div>
        <div class="slide_workspace">
            <div class="slide_thumbs"><div class="slide_thumb_item">1</div></div>
            <div class="slide_canvas_area">
                <div class="slide_canvas" id="slideCanvas" contenteditable="true" oninput="saveCurrentSlide()">
                    <h1 style="margin-bottom: 16px;">Click to add title</h1>
                    <p style="color: var(--text-secondary);">Click to add subtitle</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let activeSlideId = null;
        const DEFAULT_SLIDES = [
            { id: "slide_1", title: "Project Strategy & Roadmap Q4", owner: "me", date: "12 Nov 2026" },
            { id: "slide_2", title: "Quarterly Design Systems Pitch", owner: "me", date: "10 Nov 2026" }
        ];

        function loadSlides() {
            let slides = JSON.parse(localStorage.getItem("workspace_offline_slides") || "null");
            if (!slides) {
                slides = DEFAULT_SLIDES;
                localStorage.setItem("workspace_offline_slides", JSON.stringify(slides));
            }
            renderSlides(slides);
        }

        function renderSlides(slides) {
            const table = document.getElementById("slidesListTable");
            let html = "";
            slides.forEach(s => {
                html += `
                <div class="slides_row" onclick="openSlide('${s.id}')">
                    <div class="slide_title_cell">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z" fill="#F4B400"/><path d="M8 8h8v8H8z" fill="#F4B400"/></svg>
                        <span>${s.title}</span>
                    </div>
                    <div style="color: var(--text-secondary); font-size: 13px;">${s.owner}</div>
                    <div style="color: var(--text-secondary); font-size: 13px;">${s.date}</div>
                    <div style="text-align: right; color: var(--text-secondary);">⋮</div>
                </div>`;
            });
            table.innerHTML = html;
        }

        function filterSlides(q) {
            const query = q.toLowerCase();
            const slides = JSON.parse(localStorage.getItem("workspace_offline_slides") || "[]");
            renderSlides(slides.filter(s => s.title.toLowerCase().includes(query)));
        }

        function createNewSlide() {
            const newId = "slide_" + Date.now();
            const newSlide = { id: newId, title: "Untitled presentation", owner: "me", date: "Today" };
            const slides = JSON.parse(localStorage.getItem("workspace_offline_slides") || "[]");
            slides.unshift(newSlide);
            localStorage.setItem("workspace_offline_slides", JSON.stringify(slides));
            openSlide(newId);
        }

        function openSlide(id) {
            activeSlideId = id;
            const slides = JSON.parse(localStorage.getItem("workspace_offline_slides") || "[]");
            const slide = slides.find(s => s.id === id);
            if (!slide) return;
            document.getElementById("slideTitleInput").value = slide.title;
            document.getElementById("slideCanvas").innerHTML = localStorage.getItem("content_" + id) || "<h1>" + slide.title + "</h1><p>Offline presentation slide</p>";
            document.getElementById("slidesEditorOverlay").style.display = "flex";
        }

        function closeEditor() {
            document.getElementById("slidesEditorOverlay").style.display = "none";
            loadSlides();
        }

        function saveCurrentSlide() {
            if (!activeSlideId) return;
            const title = document.getElementById("slideTitleInput").value;
            const content = document.getElementById("slideCanvas").innerHTML;
            localStorage.setItem("content_" + activeSlideId, content);
            const slides = JSON.parse(localStorage.getItem("workspace_offline_slides") || "[]");
            const idx = slides.findIndex(s => s.id === activeSlideId);
            if (idx >= 0) {
                slides[idx].title = title;
                localStorage.setItem("workspace_offline_slides", JSON.stringify(slides));
            }
        }

        window.onload = loadSlides;
    </script>
</body>
</html>
